name: Database e documenti

# Controlla che le migrazioni si applichino da zero e che i documenti del database
# non restino indietro rispetto allo schema. Sta in un file suo per non intralciare
# il workflow CI principale.

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-e-documenti:
    name: Migrazioni da zero e documenti allineati
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_PASSWORD: ci-only-password
      DSN: postgresql://arcade_admin:ci-only-password@localhost:5432/arcade
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa le dipendenze degli script
        run: python -m pip install --quiet -r scripts/dati/requirements.txt

      # Stesse variabili del Compose locale, così il database di prova è quello vero.
      - name: Avvia PostgreSQL
        run: |
          docker run -d --name arcade-ci \
            -e POSTGRES_USER=arcade_admin \
            -e POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            -e POSTGRES_DB=arcade \
            -p 5432:5432 postgres:16
          for _ in $(seq 1 40); do
            if docker exec arcade-ci pg_isready -U arcade_admin -d arcade >/dev/null 2>&1; then
              echo "PostgreSQL pronto."
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL non è partito."
          docker logs arcade-ci
          exit 1

      # Un database vuoto e tutte le migrazioni in ordine: se una non è ripetibile da zero,
      # qui si vede. Ogni migrazione contiene anche il controllo del dizionario dati.
      - name: Applica tutte le migrazioni
        run: |
          set -euo pipefail
          for file in $(ls database/migrations/V*.sql | sort); do
            echo "== $file"
            docker exec -i arcade-ci psql -U arcade_admin -d arcade -v ON_ERROR_STOP=1 -q < "$file"
          done

      - name: Il modello ER cita tutte le tabelle
        run: python scripts/dati/verifica_modello_er.py --dsn "$DSN"

      - name: Il dizionario dati è aggiornato
        run: |
          python scripts/dati/genera_doc_dizionario.py --dsn "$DSN"
          if ! git diff --quiet -- docs/dizionario-dati.md; then
            echo "::error file=docs/dizionario-dati.md::Il dizionario non corrisponde al database. Rigeneralo con scripts/dati/genera_doc_dizionario.py e aggiungi il file al commit."
            git --no-pager diff -- docs/dizionario-dati.md
            exit 1
          fi
          echo "Il dizionario corrisponde al database."

      - name: Registro di PostgreSQL se qualcosa fallisce
        if: failure()
        run: docker logs arcade-ci

      - name: Ferma PostgreSQL
        if: always()
        run: docker rm -f arcade-ci
