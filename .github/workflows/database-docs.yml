name: Database e documenti

# Costruisce l'immagine del database del progetto e la avvia da zero, quindi le migrazioni
# vengono applicate dall'entrypoint come succede davvero alla prima accensione. Se una
# migrazione fallisce, il contenitore esce e qui si vede: il controllo Compose non se ne
# accorge, perché al riavvio PostgreSQL trova la cartella dati già creata e salta
# l'inizializzazione, partendo con lo schema a metà.

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-e-documenti:
    name: Migrazioni da zero e documenti allineati
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_PASSWORD: ci-only-password
      DSN: postgresql://arcade_admin:ci-only-password@127.0.0.1:5432/arcade
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Installa le dipendenze degli script
        run: python -m pip install --quiet -r scripts/dati/requirements.txt

      - name: Costruisci l'immagine del database del progetto
        run: docker build --file Dockerfile --tag arcade-db:ci .

      # Le stesse variabili del Compose locale. L'entrypoint crea il ruolo applicativo
      # e poi applica le migrazioni in ordine alfabetico.
      - name: Avvia il database e applica le migrazioni
        run: |
          docker run -d --name arcade-ci \
            -e POSTGRES_USER=arcade_admin \
            -e POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            -e POSTGRES_DB=arcade \
            -p 127.0.0.1:5432:5432 arcade-db:ci
          for _ in $(seq 1 90); do
            if [ "$(docker inspect -f '{{.State.Running}}' arcade-ci)" != "true" ]; then
              echo "::error::L'inizializzazione del database è fallita: una migrazione non si applica su un database vuoto."
              docker logs arcade-ci
              exit 1
            fi
            # Durante l'inizializzazione il server ascolta solo sul socket interno:
            # la porta pubblicata risponde soltanto a migrazioni finite.
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/5432' 2>/dev/null; then
              echo "Migrazioni applicate, database pronto."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Il database non è diventato pronto entro il tempo previsto."
          docker logs arcade-ci
          exit 1

      - name: Il modello ER cita tutte le tabelle
        run: python scripts/dati/verifica_modello_er.py --dsn "$DSN"

      - name: Il dizionario dati è aggiornato
        run: |
          python scripts/dati/genera_doc_dizionario.py --dsn "$DSN"
          if ! git diff --quiet -- docs/dizionario-dati.md; then
            echo "::error file=docs/dizionario-dati.md::Il dizionario non corrisponde al database. Rigeneralo con scripts/dati/genera_doc_dizionario.py e aggiungi il file al commit."
            git --no-pager diff -- docs/dizionario-dati.md
            exit 1
          fi
          echo "Il dizionario corrisponde al database."

      - name: Registro del database se qualcosa fallisce
        if: failure()
        run: docker logs arcade-ci || true

      - name: Ferma il database
        if: always()
        run: docker rm -f arcade-ci || true
