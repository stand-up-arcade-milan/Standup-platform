name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: bun run build
        working-directory: frontend

  backend:
    name: Backend verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp verify
        working-directory: backend

  openapi:
    name: OpenAPI contract lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npx --yes @redocly/cli@2.64.1 lint --extends minimal docs/openapi.yaml

  compose-smoke:
    name: Compose integration smoke check
    runs-on: ubuntu-latest
    needs: [frontend, backend, openapi]
    timeout-minutes: 20
    env:
      POSTGRES_USER: ci_runner
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build production frontend image
        run: docker build --file frontend/Dockerfile --target production --tag standup-platform-frontend:ci ./frontend
      - name: Build and start services
        run: docker compose up -d --build
      - name: Verify database, API, and frontend proxy
        shell: bash
        run: |
          for attempt in $(seq 1 45); do
            if curl -fsS http://localhost:5173/ >/dev/null \
              && curl -fsS http://localhost:5173/api/v1/health | grep -q '"status":"UP"' \
              && curl -fsS http://localhost:5173/actuator/health | grep -q '"db":{"status":"UP"'; then
              echo "Frontend, API, and PostgreSQL are reachable through Compose."
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1
      - name: Collect service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down --remove-orphans
