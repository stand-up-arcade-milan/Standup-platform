openapi: 3.0.3
info:
  title: ARCADE Milano API
  version: 0.1.0
  description: |
    Bozza del contratto REST per l'MVP ARCADE Milano 2026. Il backend Java/Spring Boot
    gestito da BID è il punto d'ingresso per React, Power Apps, scansione e simulatori.

    Scambio BID-BAD proposto:
    - BID espone a BAD fatti sorgente senza email, codici QR in chiaro o anagrafiche personali.
    - BAD calcola e pubblica gli indicatori con PUT /integrazioni/bad/kpi/{batchId}.
    - BID valida e conserva il risultato; i client leggono gli indicatori da GET /kpi/....

    Le route /bi/dati e /integrazioni/bad sono la proposta di integrazione da concordare
    con BAD. Nessuna API o implementazione Spring Boot è ancora presente nel repository.
    Le viste SQL V003 e V007 contengono calcoli già abbozzati: prima di usarle come KPI
    ufficiali, BID e BAD devono confermare formula, proprietario e versione per evitare
    di calcolare lo stesso indicatore in due punti.
servers:
  - url: /api/v1
    description: API locale o ambiente applicativo
tags:
  - name: Sistema
    description: Stato e diagnostica del servizio.
  - name: Pubblico
    description: Consultazione e richieste dal portale pubblico.
  - name: Autenticazione
    description: Accesso, inviti e gestione della sessione.
  - name: Commerciale
    description: Richieste, pratiche, offerte e dati commerciali.
  - name: Operativita
    description: Accessi, scansioni e acquisizione dei conteggi.
  - name: Espositore
    description: Profilo e dati riservati all'organizzazione autenticata.
  - name: KPI
    description: Indicatori già calcolati e restituiti ai client.
  - name: Integrazione BID-BAD
    description: Esportazione fatti BID e ricezione dei lotti KPI BAD.
  - name: Amministrazione
    description: Configurazione delle edizioni e gestione degli avvisi.
security: []
paths:
  /health:
    get:
      tags: [Sistema]
      summary: Verifica che l'API di base sia raggiungibile
      operationId: getSystemHealth
      security: []
      responses:
        '200':
          description: Il servizio API è attivo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiHealth' }
        '500': { $ref: '#/components/responses/ServerError' }

  /edizioni:
    get:
      tags: [Pubblico]
      summary: Elenca le edizioni disponibili
      operationId: listEdizioni
      parameters:
        - name: attiva
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Edizioni trovate
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Edizione' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /padiglioni:
    get:
      tags: [Pubblico]
      summary: Elenca padiglioni e capienze per edizione
      operationId: listPadiglioni
      parameters:
        - $ref: '#/components/parameters/Edizione'
      responses:
        '200':
          description: Padiglioni e varchi
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Padiglione' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /stand:
    get:
      tags: [Pubblico, Commerciale]
      summary: Elenca stand, disponibilità e dati della planimetria
      operationId: listStand
      security:
        - internalBearer: []
        - exhibitorJwt: []
      parameters:
        - $ref: '#/components/parameters/Edizione'
        - name: padiglione
          in: query
          schema: { type: string }
        - name: stato
          in: query
          schema: { type: string, enum: [LIBERO, ASSEGNATO, NON_DISPONIBILE] }
      responses:
        '200':
          description: Stand filtrati in base al ruolo
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Stand' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /mappa:
    get:
      tags: [Pubblico]
      summary: Restituisce stand, varchi e indicatori aggregati per la mappa
      operationId: getMappa
      parameters:
        - $ref: '#/components/parameters/Edizione'
        - name: includiAffollamento
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Dati cartografici senza percorsi personali
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mappa' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /espositori:
    get:
      tags: [Pubblico]
      summary: Cerca e filtra espositori visibili nel portale
      operationId: listEspositori
      parameters:
        - name: q
          in: query
          description: Ricerca per ragione sociale o nome pubblico
          schema: { type: string, maxLength: 120 }
        - name: categoria
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Edizione'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Pagina di espositori
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EspositorePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /espositori/categorie:
    get:
      tags: [Pubblico]
      summary: Elenca categorie pubbliche e conteggi degli espositori
      operationId: listCategorieEspositori
      parameters:
        - $ref: '#/components/parameters/Edizione'
      responses:
        '200':
          description: Categorie con conteggi aggiornati
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CategoriaEspositore' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /espositori/{id}:
    get:
      tags: [Pubblico]
      summary: Restituisce la scheda pubblica di un espositore
      operationId: getEspositorePubblico
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Edizione'
      responses:
        '200':
          description: Scheda pubblica
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EspositorePubblico' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /espositori/me:
    get:
      tags: [Espositore]
      summary: Restituisce il profilo collegato all'account espositore
      operationId: getMioEspositore
      security:
        - exhibitorJwt: []
      responses:
        '200':
          description: Profilo dell'organizzazione autenticata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfiloEspositore' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /espositori/me/contratto:
    get:
      tags: [Espositore]
      summary: Restituisce contratto, stato pratica e documenti dell'espositore
      operationId: getMioContratto
      security:
        - exhibitorJwt: []
      parameters:
        - $ref: '#/components/parameters/Edizione'
      responses:
        '200':
          description: Contratto dell'organizzazione autenticata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContrattoEspositore' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /espositori/me/contatti:
    get:
      tags: [Espositore]
      summary: Elenca i contatti autorizzati dei soli stand dell'espositore
      operationId: listMieiContatti
      security:
        - exhibitorJwt: []
      parameters:
        - $ref: '#/components/parameters/Edizione'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Contatti visibili in base a consenso e regole MQL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContattoPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /espositori/me/presenze-peso:
    get:
      tags: [Espositore, KPI]
      summary: Restituisce la stima delle presenze dal peso per gli espositori PREMIUM
      operationId: getMiePresenzePeso
      security:
        - exhibitorJwt: []
      parameters:
        - $ref: '#/components/parameters/Edizione'
        - name: dal
          in: query
          schema: { type: string, format: date-time }
        - name: al
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Stime con fonte, letture e margine dichiarato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeriePresenzePeso' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Account non PREMIUM o non autorizzato allo stand
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/ServerError' }

  /richieste/espositore:
    post:
      tags: [Pubblico]
      summary: Invia una richiesta di stand e crea una pratica in BOZZA
      operationId: createRichiestaEspositore
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RichiestaEspositore' }
      responses:
        '201':
          description: Richiesta registrata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RichiestaAccettata' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }

  /richieste/visitatore:
    post:
      tags: [Pubblico]
      summary: Registra una richiesta di aggiornamenti per il visitatore
      operationId: createRichiestaVisitatore
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RichiestaVisitatore' }
      responses:
        '201':
          description: Richiesta registrata anche senza consenso marketing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RichiestaAccettata' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /visitatori/registrazioni:
    post:
      tags: [Pubblico]
      summary: Registra i dati minimi e i consensi separati del visitatore
      operationId: createRegistrazioneVisitatore
      description: La registrazione non vende né emette il biglietto. La profilazione richiede fascia adulta e consenso marketing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrazioneVisitatore' }
      responses:
        '201':
          description: Registrazione creata; il biglietto resta a carico della biglietteria esterna
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrazioneCreata' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /visitatori/registrazioni/{id}/consensi:
    patch:
      tags: [Autenticazione]
      summary: Revoca o aggiorna i consensi del visitatore
      operationId: updateConsensiVisitatore
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AggiornamentoConsensi' }
      responses:
        '200':
          description: Consensi aggiornati
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Consensi' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/login:
    post:
      tags: [Autenticazione]
      summary: Autentica un account espositore
      operationId: loginEspositore
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Token JWT a scadenza breve
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429':
          description: Troppi tentativi di accesso
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/invito/accetta:
    post:
      tags: [Autenticazione]
      summary: Accetta un invito monouso e imposta la password dell'espositore
      operationId: acceptInvitoEspositore
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccettazioneInvito' }
      responses:
        '200':
          description: Account attivato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/password/recupero:
    post:
      tags: [Autenticazione]
      summary: Richiede il recupero password senza rivelare se l'email esiste
      operationId: requestPasswordRecovery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202':
          description: Richiesta presa in carico con messaggio generico
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string, example: "Se l'account esiste, riceverai un link." }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /richieste:
    get:
      tags: [Commerciale]
      summary: Elenca le richieste in attesa di gestione
      operationId: listRichiesteCommerciali
      security:
        - internalBearer: []
      parameters:
        - name: stato
          in: query
          schema: { type: string, enum: [NUOVA, IN_LAVORAZIONE, CHIUSA] }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Richieste accessibili al commerciale
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RichiestaPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /pratiche:
    get:
      tags: [Commerciale]
      summary: Cerca pratiche commerciali
      operationId: listPratiche
      security:
        - internalBearer: []
      parameters:
        - $ref: '#/components/parameters/Edizione'
        - name: stato
          in: query
          schema: { $ref: '#/components/schemas/StatoPratica' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Pratiche nel perimetro del ruolo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PraticaPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Commerciale]
      summary: Crea una pratica in BOZZA
      operationId: createPratica
      security:
        - internalBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuovaPratica' }
      responses:
        '201':
          description: Pratica creata con prezzo calcolato dal listino
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pratica' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }

  /pratiche/{id}:
    get:
      tags: [Commerciale]
      summary: Restituisce una pratica
      operationId: getPratica
      security:
        - internalBearer: []
      parameters:
        - $ref: '#/components/parameters/IdPratica'
      responses:
        '200':
          description: Dettaglio pratica
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pratica' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    patch:
      tags: [Commerciale]
      summary: Aggiorna campi modificabili di una pratica ancora in BOZZA
      operationId: updatePratica
      security:
        - internalBearer: []
      parameters:
        - $ref: '#/components/parameters/IdPratica'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/AggiornamentoPratica' }
      responses:
        '200':
          description: Pratica aggiornata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pratica' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }

  /pratiche/{id}/stato:
    patch:
      tags: [Commerciale]
      summary: Avanza una pratica nello stato successivo
      operationId: updateStatoPratica
      description: "Transizioni valide in ordine: BOZZA, INVIATA, FIRMATA, ACCONTO_RICEVUTO. L'assegnazione dello stand alla firma è atomica."
      security:
        - internalBearer: []
      parameters:
        - $ref: '#/components/parameters/IdPratica'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stato]
              properties:
                stato: { $ref: '#/components/schemas/StatoPratica' }
                nota: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Stato aggiornato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pratica' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }

  /pratiche/{id}/offerta:
    post:
      tags: [Commerciale]
      summary: Genera l'offerta e avvia il flusso di approvazione dello sconto
      operationId: generateOfferta
      security:
        - internalBearer: []
      parameters:
        - $ref: '#/components/parameters/IdPratica'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scontoPercentuale]
              properties:
                scontoPercentuale: { type: number, minimum: 0, maximum: 100 }
                note: { type: string, maxLength: 500 }
      responses:
        '201':
          description: Offerta generata o inviata per approvazione se lo sconto supera la soglia
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentoPratica' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }

  /pratiche/{id}/documenti:
    get:
      tags: [Commerciale, Espositore]
      summary: Elenca i documenti della pratica
      operationId: listDocumentiPratica
      security:
        - internalBearer: []
        - exhibitorJwt: []
      parameters:
        - $ref: '#/components/parameters/IdPratica'
      responses:
        '200':
          description: Metadati e link autorizzati ai documenti SharePoint
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DocumentoPratica' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /pratiche/{id}/acconti:
    post:
      tags: [Commerciale]
      summary: Registra un acconto ricevuto senza incassare pagamenti online
      operationId: addAcconto
      security:
        - internalBearer: []
      parameters:
        - $ref: '#/components/parameters/IdPratica'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [importoEur, ricevutoIl]
              properties:
                importoEur: { type: number, minimum: 0.01 }
                ricevutoIl: { type: string, format: date-time }
                riferimento: { type: string, maxLength: 100 }
      responses:
        '201':
          description: Acconto registrato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Acconto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }

  /pratiche/{id}/rinnovo:
    post:
      tags: [Commerciale]
      summary: Crea una proposta di rinnovo dall'edizione precedente
