components:
  securitySchemes:
    exhibitorJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token breve emesso all'espositore dopo invito e login; contiene l'organizzazione collegata.
    internalBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token dell'account aziendale per Direzione, Commerciale, Staff e Amministratore. Issuer Entra ID o simulatore di demo da confermare.
    deviceBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Credenziale di servizio limitata al tipo e all'ambito del dispositivo/simulatore.
    badIntegrationBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Credenziale di servizio BAD, limitata alle route /bi/dati e /integrazioni/bad/kpi.
  parameters:
    Edizione:
      name: edizione
      in: query
      required: true
      schema: { type: integer, minimum: 2024 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    IdPratica:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Payload o filtro non valido
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Autenticazione assente o non valida
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Ruolo o ambito non autorizzato; include espositore BASE per la stima dal peso
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Risorsa non trovata o non visibile al chiamante
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Conflitto di stato, duplicato o stand già assegnato
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServerError:
      description: Errore inatteso; la risposta non include dettagli interni o segreti
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    ApiHealth:
      type: object
      required: [service, status]
      properties:
        service: { type: string, example: standup-platform-api }
        status: { type: string, enum: [UP] }
    Problem:
      type: object
      required: [status, code, title, requestId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, enum: [400, 401, 403, 404, 409, 429, 500] }
        code: { type: string }
        detail: { type: string }
        requestId: { type: string, format: uuid }
        errors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
    Edizione:
      type: object
      required: [anno, inizioFiera, fineFiera, stato]
      properties:
        anno: { type: integer, minimum: 2024 }
        sede: { type: string, nullable: true }
        inizioVendite: { type: string, format: date, nullable: true }
        inizioFiera: { type: string, format: date }
        fineFiera: { type: string, format: date }
        stato: { type: string, enum: [PIANIFICATA, ATTIVA, CONCLUSA] }
    Padiglione:
      type: object
      required: [codice, capienza, superficieMq, varchi]
      properties:
        codice: { type: string }
        nome: { type: string }
        capienza: { type: integer, minimum: 1 }
        superficieMq: { type: number, minimum: 0 }
        varchi:
          type: array
          items: { type: string }
    Stand:
      type: object
      required: [codice, padiglione, superficieMq, stato]
      properties:
        codice: { type: string }
        padiglione: { type: string }
        superficieMq: { type: number, minimum: 0 }
        fila: { type: integer, minimum: 1, nullable: true }
        colonna: { type: integer, minimum: 1, nullable: true }
        stato: { type: string, enum: [LIBERO, ASSEGNATO, NON_DISPONIBILE] }
        prezzoListinoEur: { type: number, minimum: 0, nullable: true }
        posizioneMappa: { type: string, nullable: true }
    Mappa:
      type: object
      required: [edizione, padiglioni]
      properties:
        edizione: { type: integer }
        padiglioni:
          type: array
          items:
            type: object
            required: [padiglione, stands, varchi]
            properties:
              padiglione: { $ref: '#/components/schemas/Padiglione' }
              stands:
                type: array
                items: { $ref: '#/components/schemas/Stand' }
              varchi:
                type: array
                items: { type: string }
        affollamento:
          type: array
          items: { $ref: '#/components/schemas/KpiObservation' }
    EspositorePage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/EspositorePubblico' }
        page: { $ref: '#/components/schemas/PageInfo' }
    EspositorePubblico:
      type: object
      required: [id, nomePubblico, categorie]
      properties:
        id: { type: string }
        nomePubblico: { type: string }
        descrizione: { type: string, nullable: true }
        logoUrl: { type: string, format: uri, nullable: true }
        categorie:
          type: array
          items: { type: string }
        stand: { $ref: '#/components/schemas/Stand' }
        sitoWeb: { type: string, format: uri, nullable: true }
        inEvidenza: { type: boolean, default: false }
    ProfiloEspositore:
      type: object
      required: [id, ragioneSociale, edizione]
      properties:
        id: { type: string }
        ragioneSociale: { type: string }
        edizione: { type: integer }
        stand: { $ref: '#/components/schemas/Stand' }
        pacchetto: { $ref: '#/components/schemas/Pacchetto' }
    CategoriaEspositore:
      type: object
      required: [codice, nome, conteggio]
      properties:
        codice: { type: string }
        nome: { type: string }
        conteggio: { type: integer, minimum: 0 }
    PageInfo:
      type: object
      required: [limit]
      properties:
        limit: { type: integer }
        nextCursor: { type: string, nullable: true }
    RichiestaEspositore:
      type: object
      required: [azienda, referente, email, categoria, metriQuadriDesiderati, consensoPrivacy]
      properties:
        azienda: { type: string, minLength: 1, maxLength: 200 }
        referente: { type: string, minLength: 1, maxLength: 160 }
        email: { type: string, format: email }
        categoria: { type: string }
        metriQuadriDesiderati: { type: number, minimum: 0.01 }
        note: { type: string, maxLength: 2000 }
        consensoPrivacy: { type: boolean, enum: [true] }
    RichiestaVisitatore:
      type: object
      required: [email]
      properties:
        nome: { type: string, maxLength: 160 }
        email: { type: string, format: email }
        consensoMarketing: { type: boolean, default: false }
    RichiestaAccettata:
      type: object
      required: [id, stato, createdAt]
      properties:
        id: { type: string, format: uuid }
        stato: { type: string, enum: [NUOVA, BOZZA] }
        createdAt: { type: string, format: date-time }
    RegistrazioneVisitatore:
      type: object
      required: [email, consensoMarketing, consensoEspositori]
      properties:
        nome: { type: string, maxLength: 160 }
        email: { type: string, format: email }
        provincia: { type: string, maxLength: 80 }
        fasciaEta:
          type: string
          enum: [18-24, 25-34, 35-44, 45+, NON_DICHIARATO]
          default: NON_DICHIARATO
        interessi:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [BETA_TEST, NEWSLETTER, EVENTO, PRODOTTO, LAVORO_STAGE]
        consensoMarketing: { type: boolean, default: false }
        consensoEspositori: { type: boolean, default: false }
    RegistrazioneCreata:
      type: object
      required: [id, profilabile, consensiAggiornatiIl]
      properties:
        id: { type: string, format: uuid }
        profilabile: { type: boolean, description: False se manca consenso marketing o fascia adulta. }
        consensiAggiornatiIl: { type: string, format: date-time }
        tokenRevoca: { type: string, description: Token monouso/rotante per modificare i consensi; non è un token di accesso. }
    AggiornamentoConsensi:
      type: object
      required: [tokenRevoca]
      properties:
        tokenRevoca: { type: string }
        consensoMarketing: { type: boolean }
        consensoEspositori: { type: boolean }
    Consensi:
      type: object
      required: [consensoMarketing, consensoEspositori, aggiornatiIl, profilabile]
      properties:
        consensoMarketing: { type: boolean }
        consensoEspositori: { type: boolean }
        aggiornatiIl: { type: string, format: date-time }
        profilabile: { type: boolean }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 12 }
    AccettazioneInvito:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password: { type: string, format: password, minLength: 12 }
    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, minimum: 1 }
    RichiestaPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, tipo, stato, createdAt]
            properties:
              id: { type: string, format: uuid }
              tipo: { type: string, enum: [ESPOSITORE, VISITATORE] }
              stato: { type: string, enum: [NUOVA, IN_LAVORAZIONE, CHIUSA] }
              createdAt: { type: string, format: date-time }
        page: { $ref: '#/components/schemas/PageInfo' }
    StatoPratica:
      type: string
      enum: [BOZZA, INVIATA, FIRMATA, ACCONTO_RICEVUTO]
    Pacchetto:
      type: string
      enum: [BASE, PREMIUM]
    NuovaPratica:
      type: object
      required: [edizione, idEspositore, codiceStand, pacchetto]
      properties:
        edizione: { type: integer }
        idEspositore: { type: string }
        codiceStand: { type: string }
        pacchetto: { $ref: '#/components/schemas/Pacchetto' }
        voci:
          type: array
          items:
            type: object
            required: [codiceVoce, quantita]
            properties:
              codiceVoce: { type: string }
              quantita: { type: number, minimum: 0.001 }
        scontoPercentuale: { type: number, minimum: 0, maximum: 100, default: 0 }
    AggiornamentoPratica:
      type: object
      properties:
        codiceStand: { type: string }
        pacchetto: { $ref: '#/components/schemas/Pacchetto' }
        scontoPercentuale: { type: number, minimum: 0, maximum: 100 }
        voci:
          type: array
          items:
            type: object
            required: [codiceVoce, quantita]
            properties:
              codiceVoce: { type: string }
              quantita: { type: number, minimum: 0.001 }
    Pratica:
      type: object
      required: [id, edizione, idEspositore, stato, pacchetto, totaleEur, createdAt]
      properties:
        id: { type: string, format: uuid }
        edizione: { type: integer }
        idEspositore: { type: string }
        codiceStand: { type: string, nullable: true }
        stato: { $ref: '#/components/schemas/StatoPratica' }
        pacchetto: { $ref: '#/components/schemas/Pacchetto' }
        totaleEur: { type: number, minimum: 0 }
        scontoPercentuale: { type: number, minimum: 0, maximum: 100 }
        approvazioneRichiesta: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PraticaPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Pratica' }
        page: { $ref: '#/components/schemas/PageInfo' }
    DocumentoPratica:
      type: object
      required: [id, tipo, nome, url, creatoIl]
      properties:
        id: { type: string, format: uuid }
        tipo: { type: string, enum: [OFFERTA, CONTRATTO, ALTRO] }
        nome: { type: string }
        url: { type: string, format: uri, description: Link temporaneo autorizzato a SharePoint. }
        creatoIl: { type: string, format: date-time }
    Acconto:
      type: object
      required: [id, importoEur, ricevutoIl]
      properties:
        id: { type: string, format: uuid }
        importoEur: { type: number, minimum: 0 }
        ricevutoIl: { type: string, format: date-time }
        riferimento: { type: string, nullable: true }
    ContrattoEspositore:
      type: object
      required: [edizione, stato, pacchetto]
      properties:
        edizione: { type: integer }
        stato: { $ref: '#/components/schemas/StatoPratica' }
        pacchetto: { $ref: '#/components/schemas/Pacchetto' }
        codiceStand: { type: string, nullable: true }
        totaleEur: { type: number, nullable: true }
        acconti:
          type: array
          items: { $ref: '#/components/schemas/Acconto' }
        documenti:
          type: array
          items: { $ref: '#/components/schemas/DocumentoPratica' }
    ContattoPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, raccoltoIl, consensoMarketing, utilizzabileMarketing]
            properties:
              id: { type: string }
              raccoltoIl: { type: string, format: date-time }
              codiceStand: { type: string }
              email: { type: string, format: email, description: Restituita solo se il consenso e l'ambito espositore lo consentono. }
              interesse: { type: string, enum: [BETA_TEST, NEWSLETTER, EVENTO, PRODOTTO, LAVORO_STAGE] }
              consensoMarketing: { type: string, enum: [SI, NO, NON_DICHIARATO] }
              utilizzabileMarketing: { type: boolean }
              mql: { type: boolean }
        page: { $ref: '#/components/schemas/PageInfo' }
    NuovoAccesso:
      type: object
      required: [eventId, edizione, varco, lettoIl, codiceBiglietto]
      properties:
        eventId: { type: string, maxLength: 100 }
        edizione: { type: integer }
        varco: { type: string }
        lettoIl: { type: string, format: date-time }
        codiceBiglietto: { type: string, writeOnly: true, description: Il QR è usato solo per la validazione e non viene restituito nei fatti esposti a BAD. }
    EsitoAccesso:
      type: object
      required: [eventId, esito, persone, lettoIl]
      properties:
        eventId: { type: string }
        esito: { type: string, enum: [INGRESSO, INGRESSO_RIFIUTATO] }
        motivoRifiuto: { type: string, enum: [BIGLIETTO_NON_VALIDO, GIA_USATO, GIORNO_NON_VALIDO], nullable: true }
        persone: { type: integer, minimum: 0 }
        lettoIl: { type: string, format: date-time }
    NuovaScansione:
      type: object
      required: [eventId, edizione, codiceStand, operatoreId, rilevataIl]
      properties:
        eventId: { type: string, maxLength: 100 }
        edizione: { type: integer }
        codiceStand: { type: string }
        operatoreId: { type: string }
        rilevataIl: { type: string, format: date-time }
        ticketRef: { type: string, description: Identificativo pseudonimizzato; non contiene nome o email. }
        idLeadMagnet: { type: integer, format: int64, nullable: true }
        consensoEspositori: { type: boolean, default: false }
        email: { type: string, format: email, writeOnly: true, description: Facoltativa; conservata solo nel registro riservato se il consenso la autorizza. }
    EsitoScansione:
      type: object
      required: [eventId, accettata, duplicata, conteggioStand]
      properties:
        eventId: { type: string }
        accettata: { type: boolean }
        duplicata: { type: boolean }
        conteggioStand: { type: integer, minimum: 0 }
        messaggio: { type: string }
    ConteggioPedana:
      type: object
      required: [eventId, edizione, padiglione, minuto, entrati, usciti, fonte]
      properties:
        eventId: { type: string, maxLength: 100 }
        edizione: { type: integer }
        padiglione: { type: string }
        minuto: { type: string, format: date-time, description: Deve essere allineato al minuto. }
        entrati: { type: integer, minimum: 0 }
        usciti: { type: integer, minimum: 0 }
        fonte: { type: string, enum: [SIMULATA, SENSORE] }
    ConteggioSensoreAi:
      type: object
      required: [eventId, edizione, codiceStand, minuto, nuovePersoneFermate, fonte]
      properties:
        eventId: { type: string, maxLength: 100 }
        edizione: { type: integer }
        codiceStand: { type: string }
        minuto: { type: string, format: date-time }
        nuovePersoneFermate: { type: integer, minimum: 0 }
        fonte: { type: string, enum: [SIMULATA, SENSORE] }
    RilevazionePeso:
      type: object
      required: [eventId, edizione, codiceStand, rilevatoIl, pesoLordoKg, taraKg, fonte]
      properties:
        eventId: { type: string, maxLength: 100 }
        edizione: { type: integer }
        codiceStand: { type: string }
        rilevatoIl: { type: string, format: date-time }
        pesoLordoKg: { type: number, minimum: 0 }
        taraKg: { type: number, minimum: 0 }
        fonte: { type: string, enum: [SIMULATA, SENSORE] }
    Acquisizione:
      type: object
      required: [eventId, acquisita, fonte]
      properties:
        eventId: { type: string }
        acquisita: { type: boolean }
        fonte: { type: string, enum: [SIMULATA, SENSORE] }
    LeadMagnet:
      type: object
      required: [id, edizione, tipo, titolo, interesse, attivo]
      properties:
        id: { type: integer, format: int64 }
        edizione: { type: integer }
        idEspositore: { type: string, nullable: true, description: Null per lead magnet ARCADE Milano. }
        tipo: { type: string, enum: [ACCESSO_BETA, CODICE_SCONTO, CONTENUTO_ESCLUSIVO, TORNEO, ESTRAZIONE, DEMO_PRIVATA] }
        titolo: { type: string }
        interesse: { type: string, enum: [BETA_TEST, NEWSLETTER, EVENTO, PRODOTTO, LAVORO_STAGE] }
        attivo: { type: boolean }
    NuovoLeadMagnet:
      type: object
      required: [edizione, tipo, titolo, interesse]
      properties:
        edizione: { type: integer }
        idEspositore: { type: string, nullable: true }
        tipo: { type: string, enum: [ACCESSO_BETA, CODICE_SCONTO, CONTENUTO_ESCLUSIVO, TORNEO, ESTRAZIONE, DEMO_PRIVATA] }
        titolo: { type: string, minLength: 1, maxLength: 200 }
        interesse: { type: string, enum: [BETA_TEST, NEWSLETTER, EVENTO, PRODOTTO, LAVORO_STAGE] }
        attivo: { type: boolean, default: true }
    Avviso:
      type: object
      required: [id, titolo, testo, pubblico, pubblicatoIl, attivo]
      properties:
        id: { type: string, format: uuid }
        titolo: { type: string }
        testo: { type: string }
        pubblico: { type: string, enum: [VISITATORI, ESPOSITORI, STAFF] }
        pubblicatoIl: { type: string, format: date-time }
        attivo: { type: boolean }
    NuovoAvviso:
      type: object
      required: [titolo, testo, pubblico]
      properties:
        titolo: { type: string, minLength: 1, maxLength: 160 }
        testo: { type: string, minLength: 1, maxLength: 4000 }
        pubblico: { type: string, enum: [VISITATORI, ESPOSITORI, STAFF] }
        pubblicatoIl: { type: string, format: date-time }
        attivo: { type: boolean, default: true }
    AggiornamentoAvviso:
      type: object
      properties:
        titolo: { type: string, maxLength: 160 }
        testo: { type: string, maxLength: 4000 }
        pubblico: { type: string, enum: [VISITATORI, ESPOSITORI, STAFF] }
        pubblicatoIl: { type: string, format: date-time }
        attivo: { type: boolean }
    ParametriEdizione:
      type: object
      properties:
        orePermanenza: { type: number, minimum: 0.001 }
        pesoMedioKg: { type: number, minimum: 0.001 }
        sogliaRumoreKg: { type: number, minimum: 0 }
        personePerMq: { type: number, minimum: 0.001 }
        sogliaAvviso: { type: number, minimum: 0.000001, maximum: 1 }
    KpiCode:
      type: string
      enum:
        - visitatori_venduti
        - ingressi_effettivi
        - picco_presenza
        - saturazione_pct
        - visitatori_per_mq
        - ricavo_per_mq
        - costo_per_contatto
        - visite_stand
        - contatti_stand
        - contatti_per_100_visite
        - contatti_su_persone_ferme_pct
        - mql
        - interesse_pubblico
        - resa_lead_magnet
    KpiObservation:
      type: object
      required: [codice, valore, unita, edizione, calcolatoIl, formulaVersione, fonte, qualita, stimato, simulato]
      properties:
        codice: { $ref: '#/components/schemas/KpiCode' }
        valore: { type: number }
        unita: { type: string, example: persone }
        edizione: { type: integer }
        periodoDal: { type: string, format: date-time, nullable: true }
        periodoAl: { type: string, format: date-time, nullable: true }
        dimensioni:
          type: object
          additionalProperties: { type: string }
          description: Filtri come padiglione, stand, categoria o canale; mai identificativi personali.
        calcolatoIl: { type: string, format: date-time }
        formulaVersione: { type: string, example: '1.0' }
        fonte:
          type: array
          items: { type: string }
        qualita: { type: string, enum: [OK, ATTENZIONE, DA_VERIFICARE] }
        flagQualita:
          type: array
          items: { type: string }
        stimato: { type: boolean }
        simulato: { type: boolean }
        nota: { type: string, nullable: true }
    KpiResponse:
      type: object
      required: [edizione, items]
      properties:
        edizione: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/KpiObservation' }
    LottoKpi:
      type: object
      required: [edizione, calcolatoIl, formulaVersione, items]
      properties:
        edizione: { type: integer }
        calcolatoIl: { type: string, format: date-time }
        formulaVersione: { type: string, minLength: 1 }
        intervalloDatiDal: { type: string, format: date-time, nullable: true }
        intervalloDatiAl: { type: string, format: date-time, nullable: true }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/KpiObservation' }
    ConfermaLottoKpi:
      type: object
      required: [batchId, stato, ricevutoIl, elementiAccettati]
      properties:
        batchId: { type: string, format: uuid }
        stato: { type: string, enum: [ACCETTATO, GIA_RICEVUTO] }
        ricevutoIl: { type: string, format: date-time }
        elementiAccettati: { type: integer, minimum: 0 }
        elementiRifiutati: { type: integer, minimum: 0 }
    FactPage:
      type: object
      required: [edizione, items, page]
      properties:
        edizione: { type: integer }
        items: { type: array, items: { type: object } }
        page: { $ref: '#/components/schemas/PageInfo' }
        estrattoIl: { type: string, format: date-time }
    FattoVendita:
      type: object
      required: [ticketRef, edizione, categoria, canale, quantita, importoEur, registratoIl]
      properties:
        ticketRef: { type: string, description: "Token pseudonimizzato stabile per l'edizione, non il QR originale." }
        ordineRef: { type: string, description: Token pseudonimizzato dell'ordine. }
        edizione: { type: integer }
        categoria: { type: string }
        canale: { type: string }
        giornoValido: { type: string, format: date, nullable: true }
        quantita: { type: integer, minimum: 1 }
        importoEur: { type: number, minimum: 0 }
        registratoIl: { type: string, format: date-time }
        flagQualita: { type: array, items: { type: string } }
    FattoAccesso:
      type: object
      required: [eventId, ticketRef, edizione, varco, lettoIl, esito, persone]
      properties:
        eventId: { type: string }
        ticketRef: { type: string, description: Token pseudonimizzato che consente il join senza esporre il QR. }
        edizione: { type: integer }
        varco: { type: string }
        lettoIl: { type: string, format: date-time }
        esito: { type: string, enum: [INGRESSO, INGRESSO_RIFIUTATO] }
        persone: { type: integer, minimum: 0 }
        flagQualita: { type: array, items: { type: string } }
    FattoStand:
      type: object
      required: [edizione, codiceStand, intervalloDal, visite, contatti]
      properties:
        edizione: { type: integer }
        codiceStand: { type: string }
        intervalloDal: { type: string, format: date-time }
        visite: { type: integer, minimum: 0 }
        contatti: { type: integer, minimum: 0 }
        contattiConConsenso: { type: integer, minimum: 0 }
        personeFermate: { type: integer, minimum: 0, nullable: true }
        flagQualita: { type: array, items: { type: string } }
    FattoCommerciale:
      type: object
      required: [edizione, espositoreRef, codiceStand, superficieMq, imponibileEur]
      properties:
        edizione: { type: integer }
        espositoreRef: { type: string, description: "Identificativo interno senza ragione sociale, email o partita IVA." }
        codiceStand: { type: string }
        pacchetto: { $ref: '#/components/schemas/Pacchetto' }
        superficieMq: { type: number, minimum: 0 }
        imponibileListinoEur: { type: number, minimum: 0 }
        scontoPercentuale: { type: number, minimum: 0, maximum: 100 }
        imponibileEur: { type: number, minimum: 0 }
        accontoPagatoEur: { type: number, minimum: 0 }
        saldoPagatoEur: { type: number, minimum: 0 }
    FattoQualita:
      type: object
      required: [edizione, fonte, codice, conteggio]
      properties:
        edizione: { type: integer }
        fonte: { type: string }
        codice: { type: string }
        conteggio: { type: integer, minimum: 0 }
    SeriePresenzePeso:
      type: object
      required: [edizione, codiceStand, items, erroreAttesoPercentuale]
      properties:
        edizione: { type: integer }
        codiceStand: { type: string }
        erroreAttesoPercentuale: { type: number, minimum: 0 }
        items:
          type: array
          items:
            type: object
            required: [minuto, presenzeStimate, letture]
            properties:
              minuto: { type: string, format: date-time }
              presenzeStimate: { type: integer, minimum: 0 }
              letture: { type: integer, minimum: 1 }
              fonte: { type: string, enum: [SIMULATA, SENSORE] }
