spring:
  application:
    name: standup-platform-api
  datasource:
    # Inside Compose, `db` resolves to the PostgreSQL service on port 5432.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/arcade}
    username: ${SPRING_DATASOURCE_USERNAME:arcade_app}
    password: ${SPRING_DATASOURCE_PASSWORD:}

arcade:
  jwt-secret: ${ARCADE_JWT_SECRET:}
  auth:
    # Local HMAC tokens are deliberately opt-in outside the Compose development stack.
    local-tokens-enabled: ${ARCADE_AUTH_LOCAL_TOKENS_ENABLED:false}
  oidc:
    issuer-uri: ${ARCADE_OIDC_ISSUER_URI:}
    jwk-set-uri: ${ARCADE_OIDC_JWK_SET_URI:}
    audience: ${ARCADE_OIDC_AUDIENCE:}
    roles-claim: ${ARCADE_OIDC_ROLES_CLAIM:roles}
    exhibitor-id-claim: ${ARCADE_OIDC_EXHIBITOR_ID_CLAIM:idEspositore}
  social:
    # Accesso degli espositori con un account Google o Microsoft. Il client id e la
    # destinazione attesa nell'ID token: senza, il fornitore resta spento e /auth/google
    # o /auth/microsoft rispondono 503 invece di fidarsi di un token non verificato.
    google:
      client-id: ${ARCADE_GOOGLE_CLIENT_ID:}
    microsoft:
      client-id: ${ARCADE_MICROSOFT_CLIENT_ID:}

server:
  # Vite and the browser reach this port through Compose's published host port.
  port: 8080

management:
  endpoints:
    web:
      # Keep the management surface small; this scaffold only needs health.
      exposure:
        include: health
  endpoint:
    health:
      # Do not disclose database component details through the public health endpoint.
      show-details: never
